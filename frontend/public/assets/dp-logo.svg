<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1200 900"
     width="1200" height="900"
     preserveAspectRatio="xMidYMid meet">
  <!-- Fondo beige identitario D+P -->
  <rect width="1200" height="900" fill="#C8C4BB"/>

  <!-- Logo d+p -->
  <!-- d y p en Playfair Display thin -->
  <text x="395" y="540"
        font-family="Playfair Display, serif"
        font-size="520"
        font-weight="300"
        fill="#E8391A"
        text-anchor="middle"
        dominant-baseline="alphabetic">
    d
  </text>

  <!-- + dibujado a mano: brazos largos y delgados, estilo cruz elegante -->
  <g fill="#E8391A">
    <!-- barra horizontal larga -->
    <rect x="480" y="385" width="240" height="24"/>
    <!-- barra vertical larga -->
    <rect x="588" y="265" width="24" height="240"/>
  </g>

  <text x="805" y="540"
        font-family="Playfair Display, serif"
        font-size="520"
        font-weight="300"
        fill="#E8391A"
        text-anchor="middle"
        dominant-baseline="alphabetic">
    p
  </text>

  <!-- Tagline -->
  <text x="600" y="700"
        font-family="Inter, Helvetica, Arial, sans-serif"
        font-size="36"
        font-weight="500"
        fill="#3A3835"
        text-anchor="middle"
        letter-spacing="14"
        opacity="0.75">
    SEÑALÉTICA / WAYFINDING
  </text>
</svg>
